name: Update free Roco Dex index
on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update online-only index
        run: python tools/update_index.py
      - name: Commit updated JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/pokedex.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: sync community pokedex index'
            git push
          fi
